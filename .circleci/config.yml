version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.1
  sonarcloud: sonarsource/sonarcloud@4.0.0

executors:
  docker-python:
    docker:
      - image: cimg/python:3.12
  docker-node:
    docker:
      - image: cimg/node:20.19
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  install-jq:
    description: "Installs jq so the assume-role step can read temporary credentials"
    steps:
      - run:
          name: Install jq
          command: |
            if command -v jq >/dev/null 2>&1; then
              exit 0
            fi
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache jq
            else
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y jq
            fi
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - install-jq
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  terraform-init-then-plan:
    description: "Initializes and run plan from terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rPzp7kChj9Z72jls470HfO0YvieTbdUiB+y8hlxJN8c"
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform plan -out=plan.out
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
            - project/*
  terraform-compliance:
    description: "Run Terraform Compliance checks"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            apk add --update --no-cache python3 && ln -sf python3 /usr/bin/python
            apk add --update --no-cache g++ gcc libxslt-dev python3-dev
            python3 -m ensurepip
            pip3 install --no-cache --upgrade pip setuptools
            pip install terraform-compliance
            terraform-compliance -f terraform-compliance/ -p plan.out
          name: terraform compliance
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  terraform-apply:
    description: "Runs Terraform Apply"
    parameters:
      environment:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rPzp7kChj9Z72jls470HfO0YvieTbdUiB+y8hlxJN8c"
      - *attach_workspace
      - checkout
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve plan.out
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
  remove-serverless-stack:
    description: "Removes a Serverless stack without creating a deployment artifact"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: Install Serverless Framework v4
          command: sudo npm install --global serverless@4
      - run:
          name: Remove Serverless stack
          no_output_timeout: 45m
          command: |
            cd ./ReferenceDataApi/
            sls remove --config serverless.teardown.yml --stage <<parameters.stage>> --region eu-west-2
  terraform-destroy-plan:
    description: "Creates a Terraform destroy plan for review before approval"
    parameters:
      environment:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rPzp7kChj9Z72jls470HfO0YvieTbdUiB+y8hlxJN8c"
      - *attach_workspace
      - checkout
      - run:
          name: Create destroy plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init -input=false
            terraform plan -destroy -input=false -out=destroy.plan
            mkdir -p ~/destroy-plan
            cp destroy.plan ~/destroy-plan/destroy.plan
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
            - destroy-plan/destroy.plan
  terraform-destroy:
    description: "Applies the reviewed Terraform destroy plan"
    parameters:
      environment:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rPzp7kChj9Z72jls470HfO0YvieTbdUiB+y8hlxJN8c"
      - *attach_workspace
      - checkout
      - run:
          name: Destroy Terraform resources
          no_output_timeout: 45m
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init -input=false
            terraform apply -input=false -auto-approve ~/destroy-plan/destroy.plan
  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - setup_remote_docker
      - run:
          name: Install Node.js
          command: |
            curl -sL https://deb.nodesource.com/setup_20.x | bash -
            apt-get update && apt-get install -y nodejs
      - run:
          name: Install serverless CLI
          command: npm i -g serverless
      - run:
          name: Build lambda
          command: |
            cd ./ReferenceDataApi/
            chmod +x ./build.sh
            ./build.sh
      - run:
          name: Deploy lambda
          command: |
            cd ./ReferenceDataApi/
            npm i serverless-associate-waf
            npm i @serverless/safeguards-plugin --save-dev
            sls deploy --stage <<parameters.stage>> --conceal

jobs:
  check-code-formatting:
    executor: docker-dotnet
    steps:
      - checkout
      - run:
          name: Install dotnet format
          command: dotnet tool install dotnet-format --tool-path ./dotnet-format-local/
      - run:
          name: Run formatter check
          command: ./dotnet-format-local/dotnet-format --check
  build-and-test:
    executor: docker-python
    steps:
      - checkout:
          method: full
      - setup_remote_docker
      - sonarcloud/scan
      - run:
          name: build
          command: docker compose build reference-data-api-test
      - run:
          name: Run tests
          command: docker compose run reference-data-api-test
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT
  assume-role-staging:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING
  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION
  terraform-init-and-plan-development:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "development"
  terraform-compliance-development:
    executor: docker-terraform
    steps:
      - terraform-compliance:
          environment: "development"
  terraform-apply-development:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "development"
  terraform-init-and-plan-staging:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "staging"
  terraform-compliance-staging:
    executor: docker-terraform
    steps:
      - terraform-compliance:
          environment: "staging"
  terraform-apply-staging:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "staging"
  terraform-init-and-plan-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "production"
  terraform-compliance-production:
    executor: docker-terraform
    steps:
      - terraform-compliance:
          environment: "production"
  terraform-apply-production:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "production"
  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "development"
  deploy-to-staging:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "staging"
  deploy-to-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "production"
  assume-role-pre-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRE_PRODUCTION
  terraform-init-and-plan-pre-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "pre-production"
  terraform-compliance-pre-production:
    executor: docker-terraform
    steps:
      - terraform-compliance:
          environment: "pre-production"
  terraform-apply-pre-production:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "pre-production"
  deploy-to-pre-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: "pre-production"
  remove-serverless-pre-production:
    executor: docker-node
    steps:
      - remove-serverless-stack:
          stage: "pre-production"
  terraform-destroy-plan-pre-production:
    executor: docker-terraform
    steps:
      - terraform-destroy-plan:
          environment: "pre-production"
  terraform-destroy-pre-production:
    executor: docker-terraform
    steps:
      - terraform-destroy:
          environment: "pre-production"

workflows:
  check:
    jobs:
      - check-code-formatting:
          context: api-nuget-token-context
          filters:
            branches:
              ignore:
                - master
                - release
                - feat/ssi-1369-teardown-pre-production
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              ignore:
                - master
                - release
                - feat/ssi-1369-teardown-pre-production

  check-and-deploy-development:
    jobs:
      - check-code-formatting:
          context: api-nuget-token-context
          filters:
            branches:
              only: master
      - build-and-test:
          context:
            - api-nuget-token-context
            - SonarCloud
          filters:
              branches:
                only: master
      - assume-role-development:
          context: api-assume-role-housing-development-context
          requires:
            - build-and-test
      - terraform-init-and-plan-development:
          requires:
            - assume-role-development
      - terraform-compliance-development:
          requires:
            - terraform-init-and-plan-development
      - terraform-apply-development:
          requires:
            - terraform-compliance-development
      - deploy-to-development:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-apply-development

  check-and-deploy-staging-and-production:
    jobs:
      - build-and-test:
          context:
              - api-nuget-token-context
              - SonarCloud
          filters:
            branches:
              only: release
      - assume-role-staging:
          context: api-assume-role-housing-staging-context
          requires:
              - build-and-test
      - terraform-init-and-plan-staging:
          requires:
            - assume-role-staging
      - terraform-compliance-staging:
          requires:
            - terraform-init-and-plan-staging
      - terraform-apply-staging:
          requires:
            - terraform-compliance-staging
      - deploy-to-staging:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - terraform-apply-staging
      - permit-production-terraform-release:
          type: approval
          requires:
            - deploy-to-staging
      - assume-role-production:
          context: api-assume-role-housing-production-context
          requires:
              - permit-production-terraform-release
      - terraform-init-and-plan-production:
          requires:
            - assume-role-production
      - terraform-compliance-production:
          requires:
            - terraform-init-and-plan-production
      - terraform-apply-production:
          requires:
            - terraform-compliance-production
      - permit-production-release:
          type: approval
          requires:
            - terraform-apply-production
      - deploy-to-production:
          context:
            - api-nuget-token-context
            - "Serverless Framework"
          requires:
            - permit-production-release

  deploy-terraform-pre-production:
    jobs:
      - permit-pre-production-terraform-workflow:
          type: approval
          filters:
            branches:
              only: release
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          requires:
            - permit-pre-production-terraform-workflow
          filters:
            branches:
              only: release
      - terraform-init-and-plan-pre-production:
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: release
      - terraform-compliance-pre-production:
          requires:
            - terraform-init-and-plan-pre-production
          filters:
            branches:
              only: release
      - permit-pre-production-terraform-deployment:
          type: approval
          requires:
            - terraform-compliance-pre-production
          filters:
            branches:
              only: release
      - terraform-apply-pre-production:
          requires:
            - permit-pre-production-terraform-deployment
          filters:
            branches:
              only: release

  deploy-code-pre-production:
    jobs:
      - build-and-test:
          context: 
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              only: release
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          requires:
            - build-and-test
          filters:
            branches:
              only: release
      - deploy-to-pre-production:
          context:
          - api-nuget-token-context
          - "Serverless Framework"
          requires:
            - assume-role-pre-production        
          filters:
            branches:
              only: release

  teardown-pre-production:
    jobs:
      - assume-role-pre-production:
          context: api-assume-role-housing-pre-production-context
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - remove-serverless-pre-production:
          context: "Serverless Framework"
          requires:
            - assume-role-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - terraform-destroy-plan-pre-production:
          requires:
            - remove-serverless-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - permit-pre-production-terraform-destroy:
          type: approval
          requires:
            - terraform-destroy-plan-pre-production
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
      - terraform-destroy-pre-production:
          requires:
            - permit-pre-production-terraform-destroy
          filters:
            branches:
              only: feat/ssi-1369-teardown-pre-production
